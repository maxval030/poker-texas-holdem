services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: holdem
      POSTGRES_PASSWORD: holdem
      POSTGRES_DB: holdem
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 expects the volume at the parent directory so major-version
      # upgrades can use pg_upgrade without crossing a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U holdem -d holdem']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://holdem:holdem@postgres:5432/holdem
      VALKEY_URL: redis://valkey:6379
      SERVER_PORT: '3001'
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-docker-dev-change-me-to-a-long-random-string}
      BETTER_AUTH_URL: http://localhost:3001
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_URL: http://localhost:3001
        VITE_WS_URL: ws://localhost:3001
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  postgres-data:
